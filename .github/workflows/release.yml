name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  surface:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Build the surface
        working-directory: surface/app
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Package the surface
        run: |
          tar -czf surface-app.tar.gz -C surface/app out
          shasum -a 256 surface-app.tar.gz > surface-app.tar.gz.sha256
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" surface-app.tar.gz surface-app.tar.gz.sha256 --generate-notes
